name: Build and publish GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'src/**'
      - 'public/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages-build
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Publish built site to the Pages branch root
        run: |
          cp -R dist/. .
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force index.html assets logos brand-mark.svg .nojekyll
          if git diff --cached --quiet; then
            echo "The published site is already up to date."
          else
            git commit -m "Publish GitHub Pages build" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
            git push
          fi
